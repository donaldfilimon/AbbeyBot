services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abbey
      POSTGRES_PASSWORD: abbey
      POSTGRES_DB: abbeybot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - abbey_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abbey -d abbeybot"]
      interval: 5s
      timeout: 5s
      retries: 10

  abbeybot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://abbey:abbey@db:5432/abbeybot
      HTTP_HOSTNAME: 0.0.0.0
      HTTP_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  abbey_pg:
