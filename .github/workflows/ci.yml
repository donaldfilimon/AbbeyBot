name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # AbbeyCore / AbbeyServerKit / AbbeyServer / AbbeyCLI only (no AppKit/SwiftUI/SwiftData).
    # Prefer docker run over job-level `container:` so a bad/missing image is a step failure,
    # not an Actions startup_failure with zero jobs.
    runs-on: ubuntu-latest
    env:
      SWIFT_IMAGE: swiftlang/swift:nightly-6.4.x-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Pull Swift toolchain image
        run: docker pull "$SWIFT_IMAGE"

      - name: Resolve dependencies
        run: >
          docker run --rm -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift package resolve

      - name: Build (server + CLI + core)
        run: >
          docker run --rm -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift build
          --target AbbeyCore
          --target AbbeyServerKit
          --target AbbeyServer
          --target AbbeyCLI

      - name: Test AbbeyCoreTests
        run: >
          docker run --rm -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift test --filter AbbeyCoreTests

      - name: Test AbbeyCLITests
        run: >
          docker run --rm -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift test --filter AbbeyCLITests

      - name: Test AbbeyServerKitTests
        env:
          DATABASE_URL: sqlite://memory
        run: >
          docker run --rm -e DATABASE_URL -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift test --filter AbbeyServerKitTests
