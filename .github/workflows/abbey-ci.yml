name: Abbey CI

on:
  push:
    branches: [main, "cursor/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # AbbeyCore / AbbeyServerKit / AbbeyServer / AbbeyCLI only (no AppKit/SwiftUI/SwiftData).
    # Prefer docker run over job-level `container:` so a bad/missing image is a step failure,
    # not an Actions startup_failure with zero jobs.
    runs-on: ubuntu-latest
    env:
      SWIFT_IMAGE: swiftlang/swift:nightly-6.4.x-bookworm
      # Omit SwiftUI/SwiftData desktop target on Linux.
      ABBEY_PACKAGE_ROLE: server
    steps:
      - uses: actions/checkout@v4

      - name: Static and security hygiene
        run: bash Scripts/check-static-security.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build dashboard SPA
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build

      - name: Test dashboard SPA
        working-directory: web
        run: bun run test

      - name: Assert SPA assets present for SPM Resources
        run: test -f Sources/AbbeyServer/Resources/Public/index.html

      - name: Pull Swift toolchain image
        run: docker pull "$SWIFT_IMAGE"

      - name: Resolve dependencies
        run: >
          docker run --rm -e ABBEY_PACKAGE_ROLE -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift package resolve

      - name: Build (unified AbbeyBot server graph)
        run: >
          docker run --rm -e ABBEY_PACKAGE_ROLE -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift build --product AbbeyBot

      - name: Test AbbeyCoreTests
        run: >
          docker run --rm -e ABBEY_PACKAGE_ROLE -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift test --filter AbbeyCoreTests

      - name: Test AbbeyQuasarKitTests
        run: >
          docker run --rm -e ABBEY_PACKAGE_ROLE -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift test --filter AbbeyQuasarKitTests

      - name: Test AbbeyCLITests
        run: >
          docker run --rm -e ABBEY_PACKAGE_ROLE -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift test --filter AbbeyCLITests

      - name: Test AbbeyServerKitTests
        env:
          DATABASE_URL: sqlite://memory
        run: >
          docker run --rm -e ABBEY_PACKAGE_ROLE -e DATABASE_URL -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift test --filter AbbeyServerKitTests

      - name: Test AbbeyServerTests
        run: >
          docker run --rm -e ABBEY_PACKAGE_ROLE -v "$PWD":/src -w /src "$SWIFT_IMAGE"
          swift test --filter AbbeyServerTests
